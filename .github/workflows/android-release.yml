name: Android build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          ENDWE_KEYSTORE_BASE64: ${{ secrets.ENDWE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ENDWE_KEYSTORE_BASE64"
          printf '%s' "$ENDWE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/endwe-release.jks"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ENDWE_STORE_FILE: ${{ runner.temp }}/endwe-release.jks
          ENDWE_STORE_PASSWORD: ${{ secrets.ENDWE_STORE_PASSWORD }}
          ENDWE_KEY_ALIAS: ${{ secrets.ENDWE_KEY_ALIAS }}
          ENDWE_KEY_PASSWORD: ${{ secrets.ENDWE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name release APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk Endwe-release.apk

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Endwe-release-${{ github.sha }}
          path: Endwe-release.apk
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --title "Endwe $TAG_NAME" --generate-notes
          gh release upload "$TAG_NAME" Endwe-release.apk --clobber
